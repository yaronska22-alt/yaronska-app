<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0907">
<meta name="robots" content="noindex,nofollow">
<title>Yaronska_Fit · Tu app</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yaronska">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@600;800;900&family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div id="app" hidden>
<header class="top"><div class="top-in">
  <div class="brand">YARONSKA<b>_FIT</b></div>
  <span id="saveState" class="savestate" aria-live="polite"></span>
  <div class="seg" role="tablist" aria-label="Vista" hidden>
    <button id="vClient" type="button" onclick="setView('client')">Vista cliente</button>
    <button id="vCoach" class="on" type="button" onclick="setView('coach')">Entrenador</button>
  </div>
  <button id="outBtn" class="btn ghost sm" type="button" onclick="logout()" hidden>Salir</button>
</div></header>
<div id="clientView" class="phone">
  <main class="screen" id="screen"></main>
  <nav class="nav" aria-label="Secciones">
    <button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-t="food" onclick="go('food')"><svg viewBox="0 0 24 24"><path d="M7 3v8a3 3 0 0 0 3 3v7M7 3v5M10 3v5M4 3v5a3 3 0 0 0 3 3M17 21V3c-2 1-3 4-3 8h3"/></svg>Comidas</button>
    <button data-t="train" onclick="go('train')"><svg viewBox="0 0 24 24"><path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/></svg>Entreno</button>
    <button data-t="check" onclick="go('check')"><svg viewBox="0 0 24 24"><path d="M4 5h16v15H4zM8 3v4M16 3v4M8 13l3 3 5-6"/></svg>Check-in</button>
    <button data-t="res" onclick="go('res')"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5zM14 4v5h5M8 13h8M8 17h6"/></svg>Recursos</button>
  </nav>
</div>
<div id="coachView" hidden></div>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="js/supabase-2.117.0.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
